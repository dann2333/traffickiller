name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="$GITHUB_REF_NAME"
          else
            VERSION="$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist
          # 格式: GOOS GOARCH 输出名 [额外环境变量]
          while read -r os arch name extra; do
            echo "building $name"
            env CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" $extra \
              go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/traffickiller-$name" .
          done <<'EOF'
          linux amd64 linux-amd64
          linux 386 linux-386
          linux arm64 linux-arm64
          linux arm linux-armv7 GOARM=7
          linux arm linux-armv6 GOARM=6
          linux arm linux-armv5 GOARM=5
          linux mips linux-mips-softfloat GOMIPS=softfloat
          linux mipsle linux-mipsle-softfloat GOMIPS=softfloat
          linux mips linux-mips GOMIPS=hardfloat
          linux mipsle linux-mipsle GOMIPS=hardfloat
          linux mips64 linux-mips64
          linux mips64le linux-mips64le
          linux riscv64 linux-riscv64
          linux loong64 linux-loong64
          windows amd64 windows-amd64.exe
          windows 386 windows-386.exe
          windows arm64 windows-arm64.exe
          darwin amd64 darwin-amd64
          darwin arm64 darwin-arm64
          freebsd amd64 freebsd-amd64
          freebsd arm64 freebsd-arm64
          EOF

      # 用 UPX 压缩可执行文件（约能减小一半体积）。UPX 不支持的平台
      # (macOS、FreeBSD、riscv64、loong64、mips64、windows/arm64) 会跳过，保持原样。
      - name: Compress with UPX
        run: |
          set -uo pipefail
          sudo apt-get update && sudo apt-get install -y upx-ucl
          upx --version | head -1
          for f in dist/traffickiller-*; do
            if upx -q --best --lzma "$f" >/dev/null 2>&1; then
              echo "packed  $f"
            else
              echo "skipped $f (UPX 不支持该平台)"
            fi
          done

      - name: Checksums
        run: cd dist && sha256sum traffickiller-* > sha256sums.txt && ls -l

      - uses: actions/upload-artifact@v4
        with:
          name: traffickiller-${{ env.VERSION }}
          path: dist/*

      # main 分支每次推送都会刷新滚动发布 "latest"，下载链接固定不变
      - name: Publish rolling release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh api -X DELETE "repos/$GH_REPO/git/refs/tags/latest" 2>/dev/null || true
          gh release create latest dist/* --target "$GITHUB_SHA" --latest \
            --title "traffickiller $VERSION" \
            --notes "main 分支最新构建 ($VERSION)。下载对应平台的文件即可直接运行，用法见 README。"

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "traffickiller $VERSION" --generate-notes
